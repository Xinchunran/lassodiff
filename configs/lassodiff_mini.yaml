architecture_id: lassodiff_mini_core7
schema_version: 1
core_atoms: [N, CA, C, O, CB, CISO, OISO]
model:
  hidden_dim: 128
  diffusion_blocks: 4
  refiner_blocks: 4
  refiner_max_neighbors: 32
  max_refiner_displacement: 0.75
training:
  distributed: fsdp_full_shard
  world_size: 4
  per_rank_batch_size: 4
  global_batch_size: 16
  steps: 20000
  log_every: 10
  save_every: 500
  validate_every: 500
data:
  source_split: data/lassopred.lmdb/split_topology_hamming_v4.json
  cv_split: data/mini_cv5_locked_test_v1.json
  split_method: locked_v3_test_topology_stratified_cluster_5fold_v1
  folds: 5
  locked_test: true
peptide_prior:
  open_chain: 0.40
  single_crossing: 0.40
  topology_corrupted: 0.20
inference:
  construction:
    prior: single_crossing
    projection: optional_local_only
    samples: 8
  screening:
    prior: open_chain
    projection: false
    topology_guidance: false
validation:
  authoritative: lassodiff.validation.strict_lasso
  require_exactly_one_crossing: true
  require_plug_match: true
