architecture_id: lassodiff_opendde_v3
schema_version: 3
strict: true
allow_fallback: false

reasoning:
  backend: opendde_pretrained
  source_root: third_party/OpenDDE
  runtime_root: ${OPENDDE_RUNTIME_ROOT}
  checkpoint_path: ${OPENDDE_RUNTIME_ROOT}/checkpoint/opendde.pt
  checkpoint_sha256: 7b826620390afad877ee2babc6a4d0df81b94d3a0be030959853d6a7da0807cc
  opendde_commit: f607bb3c9ff299c0627ac20f5ef8e25d716ed46f
  expected_numel: 655791538
  freeze: true
  use_msa: false
  use_template: false
  cache_dir: data/opendde_reasoning_v1
  cache_schema_version: 1
  n_cycle: 10
  dtype: float16

model:
  c_s: 384
  c_z: 192
  c_a: 384
  n_heads: 8
  diffusion_blocks: 16
  expected_trainable_numel: 29948119

sequence_gate:
  enabled: true
  use_pair_state: true
  reject_threshold: 0.10
  accept_threshold: 0.80
  target_validation_fpr: 0.01
  ood_threshold: 0.90

topology:
  candidate_specific: true
  max_candidates: 3
  allow_invalid_clamp: false

structure:
  structural_tokens: true
  dynamic_geometry: true
  geometry_per_block: true
  candidate_prior_detach: true
  reasoning_gradient_scale: 0.10
  target_policy: topology_valid
  flow_loss_weight: 1.0
  bond_loss_weight: 1.0
  iso_distance_loss_weight: 10.0
  iso_angle_loss_weight: 2.0
  iso_plane_loss_weight: 2.0
  threading_loss_weight: 2.0

screening:
  run_diffusion: false
  hard_iso_projection: false
  topology_guidance: false
  allow_user_kp_override: false

training:
  opendde_lr: 0.0
  adapter_lr: 1.0e-4
  gate_lr: 1.0e-4
  structure_lr: 1.0e-4

data:
  dataset: data/lassopred.lmdb
  split: data/lassopred.lmdb/split_topology_hamming_v4.json
  require_family_split: true

fsdp:
  world_size: 4
  batch_size_per_gpu: 16
  gradient_accumulation: 1
  mixed_precision: bfloat16

validation:
  every: 250
  rollout_every: 500
  rollout_samples: 64
  sampling_steps: 20
  final_samples: 400
  final_sampling_steps: 40
  metrics_schema_version: 3
